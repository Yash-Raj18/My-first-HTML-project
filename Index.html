<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Login form </title>
</head>

<body>
    <center>
        <h1>Login Form</h>
    </center>
   
        <table>
            <tr>
                <td align="center">Username</td>
            </tr>
            <tr>
                <td align="center">
                    <input type="text" name="Username" size="" placeholder="Enter Username" required>
                </td>
            </tr>
            <tr> 
                <td align="center">email</td>
            </tr>
            <tr>
                <td align="center">
                    <input type="email" name="email" size="" placeholder="Enter email addres" required>
                </td>
            </tr>

            <tr align="center">
                <td>Password</td>
            </tr>
            <tr>
                <td align="center">
                    <input type="password" name="password" size="" placeholder="Enter Password">
                </td>
            </tr>

            <tr>
                <td align="center">
                    <input type="submit" value="Login">
                </td>
            </tr>
            <tr>
                <td align="center">
                    <input type="checkbox" checked="checked">Auto Fill
                </td>
            </tr>
            <tr>
                <td align="center">Not Register ? <a href="#">Creat an Account</a>
                </td>
            </tr>
        </table>
    </form>
    <p>Created by <strong><i>Yash Raj</i></strong></p>
</body>

</html>
